# Local monitoring stack. Start with `make infra-up`, stop with `make infra-down`.
# ShopLite itself runs on your PC (make run-shoplite); Prometheus reaches it via host.docker.internal,
# and Alloy reads the log file it writes to ../logs.
name: sentinel

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus:/etc/prometheus:ro  # config, alert rules and rule tests
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"  # only reachable from this PC
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # view dashboards without logging in (local only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shoplite.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    image: grafana/alloy:v1.10.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/shoplite:ro
      - alloy-data:/var/lib/alloy/data

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - alert-inbox

  # Placeholder receiver for alerts until the orchestrator exists. Not published to the PC.
  alert-inbox:
    image: python:3.12.11-slim
    command: ["python", "-u", "/app/inbox.py"]
    volumes:
      - ./alert-inbox/inbox.py:/app/inbox.py:ro

  # Harness delegate: runs the shoplite-deploy pipeline's steps on this PC. Opt-in, so the
  # rest of the stack works without Harness: `make harness-up` / `make harness-down`.
  # It connects OUT to Harness (no ports). With docker.sock it can start and stop containers
  # here, so only the Harness project's pipelines (run by people or the orchestrator after a
  # CAB approval) should ever reach it.
  harness-delegate:
    profiles: ["harness"]
    build: ./harness
    user: root
    mem_limit: 2g
    cpus: 1
    environment:
      ACCOUNT_ID: ${HARNESS_ACCOUNT_ID:-}
      DELEGATE_TOKEN: ${HARNESS_DELEGATE_TOKEN:-}
      MANAGER_HOST_AND_PORT: ${HARNESS_MANAGER_URL:-https://app.harness.io}
      DELEGATE_NAME: sentinel-laptop
      DELEGATE_TAGS: sentinel-laptop
      DELEGATE_TYPE: DOCKER
      NEXT_GEN: "true"
      SENTINEL_LOGS_DIR: ${SENTINEL_HOST_LOGS:-}  # the logs folder as Docker sees it
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:
