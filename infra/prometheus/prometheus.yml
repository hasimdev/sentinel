global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: shoplite
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Sentinel's own numbers: time to decide, agree rate, time to recover, rollbacks.
  - job_name: sentinel
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8001"]
